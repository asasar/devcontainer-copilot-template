name: build-and-publish

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name crwcmshared
      - run: |
          docker build -t crwcmshared.azurecr.io/backend:${{ steps.tag.outputs.value }} ./backend
          docker build -t crwcmshared.azurecr.io/frontend:${{ steps.tag.outputs.value }} ./frontend
          docker build -t crwcmshared.azurecr.io/proxy:${{ steps.tag.outputs.value }} ./proxy
          docker push crwcmshared.azurecr.io/backend:${{ steps.tag.outputs.value }}
          docker push crwcmshared.azurecr.io/frontend:${{ steps.tag.outputs.value }}
          docker push crwcmshared.azurecr.io/proxy:${{ steps.tag.outputs.value }}

  trigger-deploy:
    name: Trigger deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Dispatch deploy.yml
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                image_tag: '${{ needs.build-and-push.outputs.image_tag }}'
              }
            });
